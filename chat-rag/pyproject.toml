[project]
name = "chat-rag"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "gradio>=6.14.0",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.4.0",
    "langchain-mistralai>=1.1.4",
    "langgraph>=1.2.0",
    "langsmith[openai-agents]>=0.8.3",
    "openai-agents[litellm]>=0.17.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "typer>=0.15.0",
]

[dependency-groups]
dev = [
  "ruff",
  "modal"
]

# ──────────────────────────────────────────────────────────────────────────────
# Ruff — linter + formatter
# Run:
#   uv run ruff check .
#   uv run ruff check --fix .
#   uv run ruff format .
# ──────────────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["venv", ".venv", "__pycache__", "chroma_db"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # use pathlib over os.path
    "RUF", # ruff-specific rules
]

ignore = [
    "E501",   # line-too-long is enforced by the formatter
    "B008",   # function calls in default args (Pydantic Field idioms)
    "SIM108", # ternary preference — can hurt readability
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# load_dotenv() must run before other imports so env vars are available at module import time
"src/query_app.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
